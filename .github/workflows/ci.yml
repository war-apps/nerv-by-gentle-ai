name: CI

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: gofmt
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        shell: bash
        run: go vet ./...

      - name: go test
        shell: bash
        run: go test ./...

  test:
    name: Test suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: configure.test.ps1
        shell: pwsh
        run: pwsh -NoProfile -File tests/configure.test.ps1

      - name: configure-models.test.ps1
        shell: pwsh
        run: pwsh -NoProfile -File tests/configure-models.test.ps1

      - name: install-apply-models.test.ps1
        shell: pwsh
        run: pwsh -NoProfile -File tests/install-apply-models.test.ps1

      - name: install-skills.test.ps1
        shell: pwsh
        run: pwsh -NoProfile -File tests/install-skills.test.ps1

      - name: release.test.ps1
        shell: pwsh
        run: pwsh -NoProfile -File tests/release.test.ps1

      - name: release-guard.test.ps1
        shell: pwsh
        run: pwsh -NoProfile -File tests/release-guard.test.ps1

      - name: hook-session-start.test.sh
        shell: bash
        run: bash tests/hook-session-start.test.sh

      - name: hook-engram-project.test.sh
        shell: bash
        run: bash tests/hook-engram-project.test.sh
