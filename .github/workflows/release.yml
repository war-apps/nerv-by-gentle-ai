name: Release

on:
  push:
    branches:
      - main
      - develop
      - "release/**"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  alpha:
    name: Alpha pre-release (develop)
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: go test
        shell: bash
        run: go test ./...

      - name: hook-session-start.test.sh
        shell: bash
        run: bash tests/hook-session-start.test.sh

      - name: hook-engram-project.test.sh
        shell: bash
        run: bash tests/hook-engram-project.test.sh

      - name: install-sh.test.sh
        shell: bash
        run: bash tests/install-sh.test.sh

      - name: Compute alpha pre-release
        id: prerelease
        shell: bash
        run: |
          set -uo pipefail
          output=$(go run ./cmd/nerv release preview --pre-release alpha --json)
          exit_code=$?
          echo "$output"

          if [ "$exit_code" -ne 0 ]; then
            bump=$(echo "$output" | jq -r '.bump // empty' 2>/dev/null || true)
            if [ "$exit_code" -eq 1 ] && [ "$bump" = "none" ]; then
              echo "nothing to pre-release"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "nerv release preview failed (exit $exit_code)."
            exit "$exit_code"
          fi

          {
            echo "skip=false"
            echo "tag=$(echo "$output" | jq -r '.tag')"
            echo "last_tag=$(echo "$output" | jq -r '.last_tag // empty')"
          } >> "$GITHUB_OUTPUT"

      - name: Configure git identity
        if: steps.prerelease.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create and push pre-release tag
        if: steps.prerelease.outputs.skip != 'true'
        shell: bash
        env:
          TAG: ${{ steps.prerelease.outputs.tag }}
        run: |
          set -euo pipefail
          git tag -a "$TAG" -m "Pre-release $TAG"
          git push origin "$TAG"

      - name: Create GitHub pre-release
        if: steps.prerelease.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prerelease.outputs.tag }}
          LAST_TAG: ${{ steps.prerelease.outputs.last_tag }}
        run: |
          set -euo pipefail
          if [ -n "$LAST_TAG" ]; then
            gh release create "$TAG" --title "$TAG" --prerelease --generate-notes --notes-start-tag "$LAST_TAG"
          else
            gh release create "$TAG" --title "$TAG" --prerelease --generate-notes
          fi

  rc:
    name: Release candidate (release/*)
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: go test
        shell: bash
        run: go test ./...

      - name: hook-session-start.test.sh
        shell: bash
        run: bash tests/hook-session-start.test.sh

      - name: hook-engram-project.test.sh
        shell: bash
        run: bash tests/hook-engram-project.test.sh

      - name: install-sh.test.sh
        shell: bash
        run: bash tests/install-sh.test.sh

      - name: Compute rc pre-release
        id: prerelease
        shell: bash
        run: |
          set -uo pipefail
          output=$(go run ./cmd/nerv release preview --pre-release rc --pre-release-base current --json)
          exit_code=$?
          echo "$output"

          if [ "$exit_code" -ne 0 ]; then
            echo "nerv release preview failed (exit $exit_code)."
            exit "$exit_code"
          fi

          echo "tag=$(echo "$output" | jq -r '.tag')" >> "$GITHUB_OUTPUT"
          echo "last_tag=$(echo "$output" | jq -r '.last_tag // empty')" >> "$GITHUB_OUTPUT"

      - name: Configure git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create and push pre-release tag
        shell: bash
        env:
          TAG: ${{ steps.prerelease.outputs.tag }}
        run: |
          set -euo pipefail
          git tag -a "$TAG" -m "Pre-release $TAG"
          git push origin "$TAG"

      - name: Create GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prerelease.outputs.tag }}
          LAST_TAG: ${{ steps.prerelease.outputs.last_tag }}
        run: |
          set -euo pipefail
          if [ -n "$LAST_TAG" ]; then
            gh release create "$TAG" --title "$TAG" --prerelease --generate-notes --notes-start-tag "$LAST_TAG"
          else
            gh release create "$TAG" --title "$TAG" --prerelease --generate-notes
          fi

  stable:
    name: Stable release (main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: go test
        shell: bash
        run: go test ./...

      - name: hook-session-start.test.sh
        shell: bash
        run: bash tests/hook-session-start.test.sh

      - name: hook-engram-project.test.sh
        shell: bash
        run: bash tests/hook-engram-project.test.sh

      - name: install-sh.test.sh
        shell: bash
        run: bash tests/install-sh.test.sh

      - name: Run release guard
        id: guard
        shell: bash
        run: |
          set -uo pipefail
          notes_path="${{ runner.temp }}/notes.md"
          output=$(go run ./cmd/nerv release guard --notes "$notes_path" --json)
          exit_code=$?
          echo "$output"
          if [ "$exit_code" -ne 0 ]; then
            echo "Release guard refused this candidate (exit $exit_code)."
            exit "$exit_code"
          fi
          {
            echo "version=$(echo "$output" | jq -r '.version')"
            echo "tag=$(echo "$output" | jq -r '.tag')"
            echo "notes_path=$notes_path"
          } >> "$GITHUB_OUTPUT"

      - name: Configure git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create and push release tag
        shell: bash
        env:
          TAG: ${{ steps.guard.outputs.tag }}
        run: |
          set -euo pipefail
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.guard.outputs.tag }}
          NOTES_PATH: ${{ steps.guard.outputs.notes_path }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_PATH"

      - name: Determine Homebrew publish eligibility
        id: brew
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$HOMEBREW_TAP_TOKEN" ]; then
            echo "skip_homebrew=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip_homebrew=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish binaries with goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.15.2
          args: >-
            release --clean
            ${{ steps.brew.outputs.skip_homebrew == 'true' && '--skip=homebrew' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Open back-merge PR (main -> develop)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.guard.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --quiet origin develop
          ahead=$(git rev-list --count origin/develop..origin/main)
          if [ "$ahead" = "0" ]; then
            echo "develop already contains main; no back-merge PR needed."
            exit 0
          fi
          existing=$(gh pr list --base develop --head main --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Back-merge PR already open: #$existing"
          else
            gh pr create \
              --base develop \
              --head main \
              --title "chore: back-merge main into develop after ${TAG}" \
              --body "Back-merges the release commit and tag \`${TAG}\` from \`main\` into \`develop\`, per Gitflow."
          fi
