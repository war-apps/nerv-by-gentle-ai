name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*-rc.*"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stable:
    name: Stable release (main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: configure.test.ps1
        shell: pwsh
        run: pwsh -NoProfile -File tests/configure.test.ps1

      - name: configure-models.test.ps1
        shell: pwsh
        run: pwsh -NoProfile -File tests/configure-models.test.ps1

      - name: install-apply-models.test.ps1
        shell: pwsh
        run: pwsh -NoProfile -File tests/install-apply-models.test.ps1

      - name: install-skills.test.ps1
        shell: pwsh
        run: pwsh -NoProfile -File tests/install-skills.test.ps1

      - name: release.test.ps1
        shell: pwsh
        run: pwsh -NoProfile -File tests/release.test.ps1

      - name: release-guard.test.ps1
        shell: pwsh
        run: pwsh -NoProfile -File tests/release-guard.test.ps1

      - name: hook-session-start.test.sh
        shell: bash
        run: bash tests/hook-session-start.test.sh

      - name: hook-engram-project.test.sh
        shell: bash
        run: bash tests/hook-engram-project.test.sh

      - name: Run release guard
        id: guard
        shell: pwsh
        run: |
          $notesPath = "${{ runner.temp }}/notes.md"
          $output = pwsh -NoProfile -File tools/release-guard.ps1 -NotesPath $notesPath -Json
          $exitCode = $LASTEXITCODE
          $output | Write-Host
          if ($exitCode -ne 0) {
            Write-Host "Release guard refused this candidate (exit $exitCode)."
            exit $exitCode
          }
          $parsed = ($output -join "`n") | ConvertFrom-Json
          "version=$($parsed.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$($parsed.tag)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "notes_path=$notesPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Configure git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create and push release tag
        shell: bash
        env:
          TAG: ${{ steps.guard.outputs.tag }}
        run: |
          set -euo pipefail
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.guard.outputs.tag }}
          NOTES_PATH: ${{ steps.guard.outputs.notes_path }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_PATH"

      - name: Open back-merge PR (main -> develop)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.guard.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --quiet origin develop
          ahead=$(git rev-list --count origin/develop..origin/main)
          if [ "$ahead" = "0" ]; then
            echo "develop already contains main; no back-merge PR needed."
            exit 0
          fi
          existing=$(gh pr list --base develop --head main --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Back-merge PR already open: #$existing"
          else
            gh pr create \
              --base develop \
              --head main \
              --title "chore: back-merge main into develop after ${TAG}" \
              --body "Back-merges the release commit and tag \`${TAG}\` from \`main\` into \`develop\`, per Gitflow."
          fi

  prerelease:
    name: Pre-release (rc tag)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-rc.')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: configure.test.ps1
        shell: pwsh
        run: pwsh -NoProfile -File tests/configure.test.ps1

      - name: configure-models.test.ps1
        shell: pwsh
        run: pwsh -NoProfile -File tests/configure-models.test.ps1

      - name: install-apply-models.test.ps1
        shell: pwsh
        run: pwsh -NoProfile -File tests/install-apply-models.test.ps1

      - name: install-skills.test.ps1
        shell: pwsh
        run: pwsh -NoProfile -File tests/install-skills.test.ps1

      - name: release.test.ps1
        shell: pwsh
        run: pwsh -NoProfile -File tests/release.test.ps1

      - name: release-guard.test.ps1
        shell: pwsh
        run: pwsh -NoProfile -File tests/release-guard.test.ps1

      - name: hook-session-start.test.sh
        shell: bash
        run: bash tests/hook-session-start.test.sh

      - name: hook-engram-project.test.sh
        shell: bash
        run: bash tests/hook-engram-project.test.sh

      - name: Create GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --prerelease --generate-notes
