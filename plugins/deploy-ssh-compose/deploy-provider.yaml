# SSH and docker compose target for nerv deploy (contract:
# internal/deployprovider): dim's /update-deploy for one environment.
# publish loads the artifact's image tars and pushes its images (docker
# login to the registry first); deploy and verify run nerv's own
# deploy-ssh-compose, which reads the environment's deploy data (the
# NERV_DEPLOY_<ENVIRONMENT>_<KEY> variables, or Infisical with the
# infisical CLI), updates the container over SSH with the host's compose
# script, and checks that it is healthy and labelled with the version.
name: ssh-compose
contract_version: 1
kind: target
requires: [docker, ssh]
config:
  - key: environment
    scope: repo
    type: string
    prompt: The environment (an Infisical environment slug with source infisical)
  - key: source
    scope: repo
    type: string
    default: env
    prompt: Where the deploy data comes from (env or infisical)
  - key: infisical_project_id
    scope: repo
    type: string
    prompt: The Infisical project id (source infisical)
  - key: infisical_app_path
    scope: repo
    type: string
    prompt: The application's Infisical folder, such as /my-app (source infisical)
  - key: infisical_domain
    scope: user
    type: string
    prompt: The Infisical URL (empty uses the CLI session's)
  - key: ssh_auth
    scope: user
    type: string
    default: password
    prompt: SSH authentication (password, through sshpass and DOCKER_SSH_PASS, or key)
  - key: ssh_key_file
    scope: user
    type: string
    prompt: The SSH private key file (auth key)
  - key: ssh_known_hosts
    scope: user
    type: string
    default: ~/.ssh/known_hosts
    prompt: The known_hosts file the host keys are checked against
  - key: ssh_port
    scope: repo
    type: int
    default: "22"
    prompt: The SSH port
  - key: ssh_connect_timeout
    scope: user
    type: string
    default: 10s
    prompt: The SSH connection timeout (a Go duration)
  - key: update_timeout
    scope: repo
    type: string
    default: 15m
    prompt: The bound of the compose script's pull and up (a Go duration)
  - key: verify_healthy
    scope: repo
    type: bool
    default: "true"
    prompt: Wait for the container's (healthy) status
  - key: version_label
    scope: repo
    type: string
    default: org.opencontainers.image.version
    prompt: The image label compared with the deployed version
  - key: verify_timeout
    scope: repo
    type: string
    default: 120s
    prompt: The bound of the health wait (a Go duration)
operations:
  publish:
    - argv: [docker, load, -i, "{item}"]
      for_each: image_tars
    - argv: [docker, push, "{item}"]
      for_each: images
  deploy:
    - argv: ["{nerv}", deploy-ssh-compose, deploy]
  verify:
    - argv: ["{nerv}", deploy-ssh-compose, verify]
