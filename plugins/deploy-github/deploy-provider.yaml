# GitHub git host for nerv deploy (contract: internal/deployprovider).
# gh runs in nerv deploy's clone of origin, so it releases origin's GitHub
# repository with the user's `gh auth login` session.
name: github
contract_version: 1
kind: git-host
requires: [gh]
operations:
  releaseExists:
    - argv: [gh, release, view, "{tag}"]
      absent_stderr: "release not found"
  createRelease:
    - argv:
        - gh
        - release
        - create
        - "{tag}"
        - --title
        - "{tag}"
        - --notes-file
        - "{notes_file}"
        - {arg: --prerelease, when: prerelease}
        - --verify-tag
