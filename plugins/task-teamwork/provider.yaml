# Teamwork provider of the NERV task extension (contract: docs/extensions.md
# and the task:task skill).
name: teamwork
extension: task
slot: provider
contract_version: 1
runtime: agent
task_ref_prefix: TW

# Teamwork's official MCP server (github.com/Teamwork/mcp). This plugin
# ships it in .mcp.json as "teamwork" (https://mcp.ai.teamwork.com, no
# credential: each user signs in once with OAuth from /mcp in Claude Code).
# A server registered by hand under the same name works too:
#   claude mcp add --transport http teamwork https://mcp.ai.teamwork.com \
#     --header "Authorization: Bearer <token>"
# The claude.ai Teamwork connector (Teamwork.com) serves the same tools and
# counts too; any other server's tools do not (see README.md, Connect to Teamwork).
mcp:
  server: teamwork
  connectors: [Teamwork.com]
  tools:
    - twprojects-get_task
    - twprojects-list_tasks
    - twprojects-create_task
    - twprojects-update_task
    - twprojects-complete_task
    - twprojects-create_comment
    - twprojects-list_workflow_stages
    - twprojects-move_task_to_workflow_stage
    - twprojects-create_timelog
    - twprojects-update_timelog
    - twprojects-list_timelogs
    - twprojects-list_projects
    - twprojects-list_tasklists

# Read from tasks.providers.teamwork.<key>: the scope: repo keys from .ai-workflow/config.yaml only,
# the scope: user keys from the user config.yaml (the project file still wins when it sets one).
config:
  - key: assignee_id
    scope: user
    type: int
    prompt: Your Teamwork user id (assigned on start and take, matched by /task:me)
  - key: default_project_id
    scope: user
    type: int
    prompt: Default Teamwork project id for new tasks and /task:all
  - key: default_tasklist_id
    scope: user
    type: int
    prompt: Default Teamwork tasklist id for new tasks
  - key: project_id
    scope: repo
    type: int
    prompt: Teamwork project id of this repository (overrides default_project_id)
  - key: tasklist_id
    scope: repo
    type: int
    prompt: Teamwork tasklist id of this repository (overrides default_tasklist_id)
  - key: rounding_minutes
    scope: user
    type: int
    default: "15"
    prompt: Round every logged block up to this many minutes
  - key: billable
    scope: user
    type: bool
    default: "false"
    prompt: Log time as billable
  - key: stages
    scope: user
    type: map
  - key: stage_variants
    scope: user
    type: map
  - key: comment_labels
    scope: user
    type: map
  - key: comment_rest
    scope: user
    type: map
  - key: known_projects
    scope: user
    type: map

# Default case- and accent-insensitive substrings of the board's stage
# names; tasks.providers.teamwork.stages.<key> overrides each one.
stages:
  pending: PENDIENTE
  analysis: ANALISIS
  inDev: DESARROLLO
  testing: TESTING
  implemented: IMPLEMENTA
  blocked: BLOQUEA
  canceled: CANCEL

operations:
  getTask: procedures/get-task.md
  assign: procedures/assign.md
  moveStage: procedures/move-stage.md
  logTime: procedures/log-time.md
  updateTimelog: procedures/update-timelog.md
  deleteTimelog: procedures/delete-timelog.md
  listTimelogs: procedures/list-timelogs.md
  createTask: procedures/create-task.md
  createSubtask: procedures/create-subtask.md
  comment: procedures/comment.md
  complete: procedures/complete.md
  setPriority: procedures/set-priority.md
  listTasks: procedures/list-tasks.md

events:
  - run.started
  - verification.started
  - audit.ranked
  - issue.deferred
  - wave.started
  - run.closed
  - run.halted
