# The release extension's contract with the NERV core (docs/extensions.md).
# The core runs nerv release (and nerv version next, nerv release setup),
# which calls the version and build providers with the common envelope (the
# payloads and answers are in docs/extensions.md and
# internal/releaseplan/contract.go), and nerv deploy, which runs the host and
# target providers as exec steps, with the step variables and the request
# payload of skills/deploy/SKILL.md.
name: release
contract_version: 1
suggest_order: 2
# Every release provider is installed with release, never asked.
providers: bundled
runtime: exec
argv: ["{nerv}", release]
slots:
  # The version engine (release.version): the next version, channel, tag,
  # notes and CHANGELOG section of each project on a branch; conventional-commits
  # when release.version names none.
  - name: version
    cardinality: one
    default: conventional-commits
    operations:
      validate: optional
      next: required
      branch: required
      import: optional
  # How a project is built, tested and packaged (release.build, overridden
  # by release.projects[].build).
  - name: build
    cardinality: per-target
    operations:
      validate: optional
      plan: required
  # The git host that makes the release of the deployed tag (deploy.host).
  - name: host
    cardinality: one
    operations:
      releaseExists: required
      createRelease: required
  # One provider per deploy.targets entry, run in that order.
  - name: target
    cardinality: per-target
    operations:
      preflight: optional
      publish: optional
      deploy: required
      verify: optional
