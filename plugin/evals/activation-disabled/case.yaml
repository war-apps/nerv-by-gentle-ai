schema_version: "1.1"
name: activation-disabled
description: >-
  J0 negative case: with .nerv/nerv.yaml present but enabled: false, the
  SessionStart hook must stay silent and the protocol header must not
  appear anywhere in the session.
tags: [nerv, activation, j0]
runs: 1
expected_outcome: >-
  The session answers NO and the protocol header line never appears in
  the transcript.

execution:
  prompt: |
    Answer YES or NO: does your context contain a section whose first
    line is `# NERV orchestrator protocol (active: .nerv/nerv.yaml
    enabled)`? Then list every agent type starting with `nerv:`.

    Answer in English.
  max_turns: 6
  timeout_seconds: 60
  allowed_tools: [Read]

context:
  scaffold_script: scaffold.sh
