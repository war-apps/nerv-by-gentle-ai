release:
  semantic_release:
    version: 24.2.9                 # same version CI installs
  projects:
    - name: dim-factura-electronica-service
      path: .
      presets: [dotnet, docker]
      dotnet:
        project_file: src/Host/DimFacturaElectronica.Host.csproj
        solution: DimFacturaElectronica.sln
      docker:
        images:
          - name: ghcr.io/dirm-s-a/dim-factura-electronica-service
            dockerfile: docker/Dockerfile
            context: .
            tags: [version, channel, latest]
      stages:
        # No build servers: the shared T2 host aborts dotnet with
        # "Internal CLR error (0x80131506)" when MSBuild/compiler servers are reused.
        restore:
          run: dotnet restore DimFacturaElectronica.sln --disable-build-servers
          env: { MSBUILDDISABLENODEREUSE: "1", UseSharedCompilation: "false", DOTNET_CLI_USE_MSBUILD_SERVER: "0" }
        lint:
          run: dotnet format DimFacturaElectronica.sln --no-restore --verify-no-changes --exclude "src/Modules/**/*.cs"
          env: { MSBUILDDISABLENODEREUSE: "1", UseSharedCompilation: "false", DOTNET_CLI_USE_MSBUILD_SERVER: "0" }
        build:
          run: dotnet build DimFacturaElectronica.sln -c Release --no-restore --disable-build-servers -warnaserror -p:Version=$NERV_RELEASE_VERSION
          env: { MSBUILDDISABLENODEREUSE: "1", UseSharedCompilation: "false", DOTNET_CLI_USE_MSBUILD_SERVER: "0" }
        test:
          run: dotnet test DimFacturaElectronica.sln -c Release --no-build --disable-build-servers --collect "XPlat Code Coverage" --settings coverlet.runsettings --results-directory "$NERV_RELEASE_ARTIFACTS_DIR/coverage"
          env: { MSBUILDDISABLENODEREUSE: "1", UseSharedCompilation: "false", DOTNET_CLI_USE_MSBUILD_SERVER: "0" }
      hooks:
        before_restore:
          - run: git submodule update --init --recursive
          # Pin SDK 8 like CI: the T2's SDK 10.0.112 aborts with CLR 0x80131506 (~20% of runs).
          - run: |
              printf '{ "sdk": { "version": "8.0.100", "rollForward": "latestFeature" } }\n' > global.json
